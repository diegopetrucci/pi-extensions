name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.19.0
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check patch whitespace
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            git diff --check "$(git hash-object -t tree /dev/null)" "$after"
          else
            git diff --check "$before" "$after"
          fi

      - name: Check PR patch whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
        if: github.event_name == 'pull_request'

      - name: Run validation
        run: npm run ci

  powershell-safety:
    name: PowerShell safety (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check installed package state
        run: npm run preflight:install-state

      - name: Exercise permission gate with the native PowerShell parser
        run: node --test test/shell-safety.test.mjs
        env:
          PI_REQUIRE_POWERSHELL_7: "1"
