name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.19.0
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check patch whitespace
        run: git diff --check HEAD~1..HEAD
        if: github.event_name == 'push'

      - name: Check PR patch whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
        if: github.event_name == 'pull_request'

      - name: Run validation
        run: npm run ci

  powershell-safety:
    name: PowerShell safety (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check installed package state
        run: npm run preflight:install-state

      - name: Exercise permission gate with the native PowerShell parser
        run: node --test test/shell-safety.test.mjs
        env:
          PI_REQUIRE_POWERSHELL_7: "1"
